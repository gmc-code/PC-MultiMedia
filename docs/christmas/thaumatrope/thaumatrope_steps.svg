h='2'/><line x1='-4' y1='6' x2='5' y2='-14' stroke='#555' stroke-width='2'/><line x1='4' y1='6' x2='-5' y2='-14' stroke='#555' stroke-width='2'/></g><text x='100' y='25' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f3b63'>1. Colour and cut</text><text x='100' y='215' text-anchor='middle' font-size='12' font-weight='normal' fill='#444'>Cut the solid line. Snip a</text><text x='100' y='231' text-anchor='middle' font-size='12' font-weight='normal' fill='#444'>tiny notch at the red marks.</text><path d='M300.0,95.6 A36,36 0 1 0 300.0,124.4 A36,36 0 1 0 300.0,95.6 Z' fill='#ffffff' stroke='#222' stroke-width='2'/><line x1='300' y1='95.6' x2='300' y2='124.4' stroke='#c62828' stroke-width='2' stroke-dasharray='5 4'/><rect x='239.0' y='84' width='56' height='52' fill='#fff3c4' opacity='0.9'/><text x='267.0' y='114' text-anchor='middle' font-size='12' fill='#888'>glue</text><line x1='333.0' y1='76' x2='333.0' y2='201' stroke='#c8a165' stroke-width='5' stroke-linecap='round'/><text x='300' y='25' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f3b63'>2. Glue and add skewer</text><text x='300' y='215' text-anchor='middle' font-size='12' font-weight='normal' fill='#444'>Turn over. Glue. Lay the</text><text x='300' y='231' text-anchor='middle' font-size='12' font-weight='normal' fill='#444'>skewer notch to notch.</text><line x1='500' y1='76' x2='500' y2='201' stroke='#c8a165' stroke-width='5' stroke-linecap='round'/><circle cx='500' cy='110' r='36' fill='#fdf8e8' stroke='#222' stroke-width='2'/><rect x='497' y='126' width='6' height='7' fill='#7a4a24'/><polygon points='500,113 483,128 517,128' fill='#2e7d32'/><polygon points='500,101 487,116 513,116' fill='#2e7d32'/><polygon points='500,89 491,104 509,104' fill='#2e7d32'/><path d='M570,100 C560,60 520,55 506,70' fill='none' stroke='#1f3b63' stroke-width='2' marker-end='url(#ar)'/><text x='500' y='25' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f3b63'>3. Fold and press</text><text x='500' y='215' text-anchor='middle' font-size='12' font-weight='normal' fill='#444'>Fold along the dashed line</text><text x='500' y='231' text-anchor='middle' font-size='12' font-weight='normal' fill='#444'>and press flat.</text><line x1='700' y1='76' x2='700' y2='201' stroke='#c8a165' stroke-width='5' stroke-linecap='round'/><ellipse cx='700' cy='110' rx='9' ry='36' fill='#fdf8e8' stroke='#222' stroke-width='2'/><rect x='666' y='171' width='22' height='34' rx='8' fill='#f2c9a0'/><rect x='712' y='171' width='22' height='34' rx='8' fill='#f2c9a0'/><path d='M670,66 A32,10 0 1 1 728,68' fill='none' stroke='#e8572a' stroke-width='2.5' marker-end='url(#ar)'/><text x='700' y='25' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f3b63'>4. Spin it</text><text x='700' y='215' text-anchor='middle' font-size='12' font-weight='normal' fill='#444'>Roll the skewer fast</text><text x='700' y='231' text-anchor='middle' font-size='12' font-weight='normal' fill='#444'>between your palms.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>